name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Infegate chart version
        required: true
        type: string
      app_version:
        description: Infegate application version packaged by the chart
        required: false
        type: string
      ui_digest:
        description: Immutable Infegate UI image digest
        required: true
        type: string
      gateway_digest:
        description: Immutable Infegate gateway image digest
        required: true
        type: string
      source_repository:
        description: Repository that published the source release
        required: true
        type: string
      source_release_id:
        description: Published GitHub Release identifier
        required: true
        type: string
      source_sha:
        description: Source release commit
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: infegate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  chart:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.4
      - name: Create source repository token
        id: source-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: demirtechcom
          repositories: infegate
          permission-contents: read
      - name: Verify dispatch identity
        env:
          APP_VERSION: ${{ inputs.app_version || inputs.version }}
          CHART_VERSION: ${{ inputs.version }}
          GATEWAY_DIGEST: ${{ inputs.gateway_digest }}
          SOURCE_RELEASE_ID: ${{ inputs.source_release_id }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          UI_DIGEST: ${{ inputs.ui_digest }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '$1 == "version:" { print $2 }' charts/infegate/Chart.yaml)" = "${CHART_VERSION}"
          test "$(awk '$1 == "appVersion:" { gsub(/\"/, "", $2); print $2 }' charts/infegate/Chart.yaml)" = "${APP_VERSION}"
          grep -Eq '^sha256:[a-f0-9]{64}$' <<<"${UI_DIGEST}"
          grep -Eq '^sha256:[a-f0-9]{64}$' <<<"${GATEWAY_DIGEST}"
          release_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${SOURCE_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY}/releases/${SOURCE_RELEASE_ID}")"
          jq -e --arg tag "v${APP_VERSION}" '.draft == false and .tag_name == $tag' <<<"${release_json}"
          ref_json="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${SOURCE_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY}/git/ref/tags/v${APP_VERSION}")"
          test "$(jq -r '.object.sha' <<<"${ref_json}")" = "${SOURCE_SHA}"
      - name: Validate source chart
        run: ./scripts/check-charts.sh
      - name: Authenticate to GHCR
        env:
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${REGISTRY_PASSWORD}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Package immutable chart
        env:
          GATEWAY_DIGEST: ${{ inputs.gateway_digest }}
          UI_DIGEST: ${{ inputs.ui_digest }}
        shell: bash
        run: |
          set -euo pipefail
          cp -R charts/infegate "${RUNNER_TEMP}/infegate"
          ruby -ryaml -e '
            path, ui_digest, gateway_digest = ARGV
            values = YAML.safe_load(File.read(path), aliases: true)
            values.fetch("ui").fetch("image")["digest"] = ui_digest
            values.fetch("api").fetch("image")["digest"] = gateway_digest
            File.write(path, YAML.dump(values))
          ' "${RUNNER_TEMP}/infegate/values.yaml" "${UI_DIGEST}" "${GATEWAY_DIGEST}"
          helm package "${RUNNER_TEMP}/infegate" --destination "${RUNNER_TEMP}"
      - name: Publish or verify immutable chart
        env:
          GATEWAY_DIGEST: ${{ inputs.gateway_digest }}
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/helm-registry.json
          UI_DIGEST: ${{ inputs.ui_digest }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="oci://ghcr.io/demirtechcom/charts/infegate"
          existing="${RUNNER_TEMP}/existing"
          mkdir -p "${existing}"
          if output="$(helm pull "${artifact}" --version "${VERSION}" --destination "${existing}" 2>&1)"; then
            values="$(helm show values "${existing}/infegate-${VERSION}.tgz")"
            actual_ui="$(ruby -ryaml -e 'puts YAML.safe_load(STDIN.read).dig("ui", "image", "digest")' <<<"${values}")"
            actual_gateway="$(ruby -ryaml -e 'puts YAML.safe_load(STDIN.read).dig("api", "image", "digest")' <<<"${values}")"
            if test "${actual_ui}" != "${UI_DIGEST}" || test "${actual_gateway}" != "${GATEWAY_DIGEST}"; then
              echo "Refusing to overwrite an existing Infegate chart with different image digests" >&2
              exit 1
            fi
            exit 0
          fi
          printf '%s\n' "${output}"
          if ! grep -Eiq '(manifest unknown|name unknown|not found)' <<<"${output}"; then
            exit 1
          fi
          if test -e "${existing}/infegate-${VERSION}.tgz"; then
            echo "Refusing to overwrite an existing Infegate chart" >&2
            exit 1
          fi
          helm push "${RUNNER_TEMP}/infegate-${VERSION}.tgz" oci://ghcr.io/demirtechcom/charts
