apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infegate.componentName" (dict "root" . "component" "ui") | quote }}
  labels:
    {{- include "infegate.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  strategy:
    type: {{ .Values.ui.strategy.type | quote }}
    {{- if eq .Values.ui.strategy.type "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml .Values.ui.strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "infegate.selectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infegate.selectorLabels" (dict "root" . "component" "ui") | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.ui.terminationGracePeriodSeconds }}
      automountServiceAccountToken: false
      serviceAccountName: {{ include "infegate.serviceAccountName" . | quote }}
      securityContext:
        {{- toYaml .Values.ui.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "infegate.image" (dict "image" .Values.ui.image) | quote }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy | quote }}
          securityContext:
            {{- toYaml .Values.ui.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            {{- include "infegate.probe" .Values.ui.startupProbe | nindent 12 }}
          readinessProbe:
            {{- include "infegate.probe" .Values.ui.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- include "infegate.probe" .Values.ui.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.ui.defaultTopologySpread.enabled .Values.ui.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- if .Values.ui.defaultTopologySpread.enabled }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "infegate.selectorLabels" (dict "root" . "component" "ui") | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "infegate.selectorLabels" (dict "root" . "component" "ui") | nindent 14 }}
        {{- end }}
        {{- with .Values.ui.topologySpreadConstraints }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
