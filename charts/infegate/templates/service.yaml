apiVersion: v1
kind: Service
metadata:
  name: {{ include "infegate.fullname" . }}
  labels:
    {{- include "infegate.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "infegate.selectorLabels" . | nindent 4 }}
