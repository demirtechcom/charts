apiVersion: v1
kind: Service
metadata:
  name: {{ include "infegate.componentName" (dict "root" . "component" "ui") }}
  labels:
    {{- include "infegate.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  selector:
    {{- include "infegate.selectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
