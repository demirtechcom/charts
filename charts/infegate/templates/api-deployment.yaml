apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "infegate.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "infegate.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "infegate.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "infegate.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ include "infegate.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "infegate.image" (dict "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          args: ["-f", "/etc/infegate/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          envFrom:
            - secretRef:
                name: {{ .Values.api.runtime.existingSecret }}
          env:
            - name: INFEGATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.database.existingSecret }}
                  key: {{ .Values.api.database.key }}
            {{- if eq .Values.api.management.authenticationMode "oidc" }}
            - name: INFEGATE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.oidc.existingSecret }}
                  key: {{ .Values.api.oidc.clientSecretKey }}
            - name: OIDC_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.oidc.existingSecret }}
                  key: {{ .Values.api.oidc.cookieSecretKey }}
            {{- end }}
          ports:
            - name: llm
              containerPort: 3000
            - name: management
              containerPort: 4000
            - name: readiness
              containerPort: 15021
            {{- if .Values.api.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.api.metrics.port }}
            {{- end }}
            {{- if .Values.api.subscriptionPassthrough.providers.claude.enabled }}
            - name: subscriptions
              containerPort: 3001
            {{- end }}
            {{- if .Values.api.mcp.enabled }}
            - name: mcp
              containerPort: 3002
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: readiness
          livenessProbe:
            httpGet:
              path: /healthz/ready
              port: readiness
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/infegate
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "infegate.componentName" (dict "root" . "component" "api") }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
