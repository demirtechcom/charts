{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "infegate.fullname" . }}
  labels:
    {{- include "infegate.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      {{- if .Values.gateway.create }}
      name: {{ include "infegate.fullname" . }}
      sectionName: https
      {{- else }}
      name: {{ .Values.gateway.parentRef.name }}
      {{- with .Values.gateway.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gateway.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
      {{- end }}
  hostnames:
    - {{ include "infegate.host" . }}
  rules:
    {{- include "infegate.httpRouteRule" (dict "root" . "path" "/v1" "type" "PathPrefix" "component" "api" "port" 3000) | nindent 4 }}
    {{- range list "/ui" "/api" "/cel" "/oauth/callback" }}
    {{- include "infegate.httpRouteRule" (dict "root" $ "path" . "type" "PathPrefix" "component" "api" "port" 4000) | nindent 4 }}
    {{- end }}
    {{- if .Values.api.subscriptionPassthrough.providers.claude.enabled }}
    {{- include "infegate.httpRouteRule" (dict "root" . "path" "/subscriptions/claude" "type" "PathPrefix" "component" "api" "port" 3001) | nindent 4 }}
    {{- end }}
    {{- if .Values.api.mcp.enabled }}
    {{- range list "/.well-known/oauth-protected-resource/mcp" "/.well-known/oauth-authorization-server/mcp" }}
    {{- include "infegate.httpRouteRule" (dict "root" $ "path" . "type" "Exact" "component" "api" "port" 3002) | nindent 4 }}
    {{- end }}
    {{- include "infegate.httpRouteRule" (dict "root" . "path" "/mcp" "type" "PathPrefix" "component" "api" "port" 3002) | nindent 4 }}
    {{- end }}
    {{- include "infegate.httpRouteRule" (dict "root" . "path" "/" "type" "Exact" "component" "ui" "port" 80) | nindent 4 }}
{{- end }}
