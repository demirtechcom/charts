{{- include "infegate.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "infegate.componentName" (dict "root" . "component" "api") | quote }}
  labels:
    {{- include "infegate.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  config.yaml: |
    config:
      adminAddr: 127.0.0.1:15000
      readinessAddr: 0.0.0.0:15021
      statsAddr: {{ ternary (printf "0.0.0.0:%v" .Values.api.metrics.port) "off" .Values.api.metrics.enabled | quote }}
      sensitiveHeaders:
        {{- toYaml .Values.api.audit.sensitiveHeaders | nindent 8 }}
      database:
        url: $INFEGATE_DATABASE_URL
        maxConnections: {{ .Values.api.database.maxConnections }}
      storage:
        mode: hybrid
      standardAttributes:
        user: 'apiKey.metadata["owner"]'
        group: 'apiKey.metadata["team"]'
    frontendPolicies:
      accessLog:
        database:
          llm: {{ ternary "full" "metadata" .Values.api.audit.capturePayloads }}
          {{- if .Values.api.audit.captureMcpPayloads }}
          add:
            mcp.tool.arguments: mcp.tool.arguments
            mcp.tool.result: mcp.tool.result
            mcp.tool.error: mcp.tool.error
          {{- end }}
    gateways:
      api:
        port: 3000
      management:
        port: 4000
        {{- if eq .Values.api.management.authenticationMode "oidc" }}
        oidc:
          issuer: {{ .Values.api.oidc.issuer | quote }}
          clientId: {{ .Values.api.oidc.clientId | quote }}
          clientSecret: $INFEGATE_OIDC_CLIENT_SECRET
          redirectURI: {{ printf "%s/oauth/callback" .Values.publicUrl | quote }}
          scopes:
            {{- toYaml .Values.api.oidc.scopes | nindent 12 }}
        {{- else }}
        jwtAuth:
          mode: strict
          location:
            header:
              name: {{ .Values.api.management.externalJwt.headerName | quote }}
          preserveToken: false
          issuer: {{ .Values.api.management.externalJwt.issuer | quote }}
          audiences:
            {{- toYaml .Values.api.management.externalJwt.audiences | nindent 12 }}
          jwks:
            url: {{ .Values.api.management.externalJwt.jwksUrl | quote }}
          jwtValidationOptions:
            requiredClaims: [exp]
        {{- end }}
        authorization:
          rules:
            {{- if eq .Values.api.management.authenticationMode "oidc" }}
            - allow: {{ .Values.api.oidc.authorizationRule | quote }}
            {{- else }}
            - allow: {{ .Values.api.management.externalJwt.authorizationRule | quote }}
            {{- end }}
      {{- if .Values.api.subscriptionPassthrough.providers.claude.enabled }}
      subscriptions:
        port: 3001
      {{- end }}
    llm:
      gateways: [api]
      models: []
      policies:
        apiKey:
          keys: []
          mode: strict
          location:
            header:
              name: authorization
              prefix: 'Bearer '
    {{- if .Values.api.mcp.enabled }}
    mcp:
      port: 3002
      policies:
        cors:
          allowOrigins:
            - {{ .Values.publicUrl | quote }}
          allowHeaders:
            - authorization
            - mcp-protocol-version
            - mcp-session-id
            - content-type
            - accept
            - cache-control
          exposeHeaders:
            - Mcp-Session-Id
        mcpAuthentication:
          mode: strict
          {{- if eq .Values.api.mcp.authenticationMode "externalJwt" }}
          authorizationLocation:
            header:
              name: {{ .Values.api.mcp.headerName | quote }}
          {{- end }}
          issuer: {{ ternary .Values.api.mcp.issuer .Values.api.oidc.issuer (eq .Values.api.mcp.authenticationMode "externalJwt") | quote }}
          audiences:
            {{- toYaml .Values.api.mcp.audiences | nindent 12 }}
          jwks:
            url: {{ .Values.api.mcp.jwksUrl | quote }}
          jwtValidationOptions:
            requiredClaims: [exp]
          {{- if eq .Values.api.mcp.authenticationMode "nativeOAuth" }}
          provider:
            keycloak: {}
          {{- end }}
          resourceMetadata:
            resource: {{ printf "%s/mcp" .Values.publicUrl | quote }}
            scopesSupported:
              - openid
              - profile
            bearerMethodsSupported:
              - header
        mcpAuthorization:
          rules:
            - {{ .Values.api.mcp.authorizationRule | quote }}
      targets: []
    {{- end }}
    routes:
      - name: management-ui
        gateways: [management]
        matches:
          - path:
              pathPrefix: /ui
        backends:
          - host: {{ printf "%s:80" (include "infegate.componentName" (dict "root" . "component" "ui")) | quote }}
      - name: management-api
        gateways: [management]
        matches:
          - path:
              pathPrefix: /api
          - path:
              pathPrefix: /cel
          {{- if eq .Values.api.management.authenticationMode "oidc" }}
          - path:
              exact: /oauth/callback
          {{- end }}
        backends:
          - internal: forward
      {{- with .Values.api.subscriptionPassthrough.providers.claude }}
      {{- if .enabled }}
      - name: subscription-claude
        gateways: [subscriptions]
        matches:
          - path:
              pathPrefix: /subscriptions/claude
        policies:
          apiKey:
            mode: strict
            location:
              header:
                name: x-infegate-key
            keys:
              {{- range .accessKeys }}
              - keyHash: {{ printf "$%s" .keyHashEnvVar | quote }}
                {{- with .metadata }}
                metadata:
                  {{- toYaml . | nindent 18 }}
                {{- end }}
              {{- end }}
          requestHeaderModifier:
            remove: [x-infegate-key]
          urlRewrite:
            path:
              prefix: /
          {{- if .rateLimit.enabled }}
          localRateLimit:
            - maxTokens: {{ .rateLimit.requestsPerInterval }}
              tokensPerFill: {{ .rateLimit.requestsPerInterval }}
              fillInterval: {{ .rateLimit.interval | quote }}
              type: requests
          {{- end }}
        backends:
          - ai:
              name: claude-subscription
              provider:
                anthropic: {}
            policies:
              ai:
                routes:
                  /v1/messages: messages
                  /v1/messages/count_tokens: anthropicTokenCount
                  "*": passthrough
      {{- end }}
      {{- end }}
