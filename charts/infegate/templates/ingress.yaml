{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "infegate.fullname" . }}
  labels:
    {{- include "infegate.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ include "infegate.host" . }}
      secretName: {{ .Values.ingress.tls.existingSecret }}
  rules:
    - host: {{ include "infegate.host" . }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "infegate.componentName" (dict "root" . "component" "api") }}
                port:
                  number: 3000
          {{- range list "/ui" "/api" "/cel" "/oauth/callback" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "infegate.componentName" (dict "root" $ "component" "api") }}
                port:
                  number: 4000
          {{- end }}
          {{- if .Values.api.subscriptionPassthrough.providers.claude.enabled }}
          - path: /subscriptions/claude
            pathType: Prefix
            backend:
              service:
                name: {{ include "infegate.componentName" (dict "root" . "component" "api") }}
                port:
                  number: 3001
          {{- end }}
{{- end }}
