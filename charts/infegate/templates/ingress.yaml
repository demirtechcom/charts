{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "infegate.fullname" . }}
  labels:
    {{- include "infegate.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ include "infegate.host" . | quote }}
      secretName: {{ .Values.ingress.tls.existingSecret }}
  rules:
    - host: {{ include "infegate.host" . | quote }}
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: {{ include "infegate.componentName" (dict "root" . "component" "api") }}
                port:
                  number: 3000
          {{- range list "/ui" "/api" "/cel" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "infegate.componentName" (dict "root" $ "component" "api") }}
                port:
                  number: 4000
          {{- end }}
          {{- if eq .Values.api.management.authenticationMode "oidc" }}
          - path: /oauth/callback
            pathType: Exact
            backend:
              service:
                name: {{ include "infegate.componentName" (dict "root" . "component" "api") }}
                port:
                  number: 4000
          {{- end }}
          {{- if .Values.api.subscriptionPassthrough.providers.claude.enabled }}
          - path: /subscriptions/claude
            pathType: Prefix
            backend:
              service:
                name: {{ include "infegate.componentName" (dict "root" . "component" "api") }}
                port:
                  number: 3001
          {{- end }}
          {{- if .Values.api.mcp.enabled }}
          {{- if eq .Values.api.mcp.authenticationMode "nativeOAuth" }}
          {{- range list "/.well-known/oauth-protected-resource/mcp" "/.well-known/oauth-authorization-server/mcp" }}
          - path: {{ . }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ include "infegate.componentName" (dict "root" $ "component" "api") }}
                port:
                  number: 3002
          {{- end }}
          {{- end }}
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "infegate.componentName" (dict "root" . "component" "api") }}
                port:
                  number: 3002
          {{- end }}
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ include "infegate.componentName" (dict "root" . "component" "ui") }}
                port:
                  number: 80
{{- end }}
