publicUrl: ""
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

api:
  replicaCount: 2
  image:
    repository: ghcr.io/demirtechcom/infegate/gateway
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  database:
    existingSecret: ""
    key: uri
    maxConnections: 5
  oidc:
    issuer: ""
    clientId: ""
    scopes:
      - profile
      - email
    existingSecret: ""
    clientSecretKey: client-secret
    cookieSecretKey: cookie-secret
    authorizationRule: ""
  runtime:
    existingSecret: ""
  audit:
    capturePayloads: null
  subscriptionPassthrough:
    providers:
      claude:
        enabled: false
        accessKeys: []
        rateLimit:
          enabled: true
          requestsPerInterval: 300
          interval: 1h
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

ui:
  replicaCount: 2
  image:
    repository: ghcr.io/demirtechcom/infegate/ui
    tag: "1.0.0"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  tls:
    existingSecret: ""
