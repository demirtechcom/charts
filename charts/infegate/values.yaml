publicUrl: ""
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

api:
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
          - type: Pods
            value: 4
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 25
            periodSeconds: 60
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  terminationGracePeriodSeconds: 60
  startupProbe:
    type: tcpSocket
    tcpSocket:
      port: readiness
    periodSeconds: 2
    failureThreshold: 30
  readinessProbe:
    type: httpGet
    httpGet:
      path: /healthz/ready
      port: readiness
    periodSeconds: 5
  livenessProbe:
    type: tcpSocket
    tcpSocket:
      port: readiness
    periodSeconds: 10
  metrics:
    enabled: true
    port: 15020
  image:
    repository: ghcr.io/demirtechcom/infegate/gateway
    tag: "1.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  database:
    existingSecret: ""
    key: uri
    maxConnections: 5
  management:
    authenticationMode: oidc
    externalJwt:
      issuer: ""
      audiences: []
      jwksUrl: ""
      headerName: X-Forwarded-Jwt
      authorizationRule: ""
  oidc:
    issuer: ""
    clientId: ""
    scopes:
      - profile
      - email
    existingSecret: ""
    clientSecretKey: client-secret
    cookieSecretKey: cookie-secret
    authorizationRule: ""
  runtime:
    existingSecret: ""
  audit:
    capturePayloads: null
    captureMcpPayloads: false
    session:
      enabled: false
      header: x-infegate-session
    costDetail:
      enabled: false
    sensitiveHeaders:
      - authorization
      - proxy-authorization
      - cookie
      - set-cookie
      - x-infegate-key
      - x-api-key
      - api-key
      - x-goog-api-key
    retention:
      enabled: false
      schedule: "17 3 * * *"
      payloadDays: 30
      metadataDays: 365
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
      image:
        repository: postgres
        tag: 18-alpine
        digest: ""
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
  mcp:
    enabled: false
    authenticationMode: nativeOAuth
    issuer: ""
    headerName: X-Forwarded-Jwt
    jwksUrl: ""
    audiences: []
    authorizationRule: ""
  subscriptionPassthrough:
    providers:
      claude:
        enabled: false
        accessKeys: []
        # A Claude Code turn resends the whole conversation, so the request body
        # grows with the session rather than with the prompt. agentgateway holds
        # an LLM request body in memory to price and audit it, and its own
        # default ceiling is 2 MiB, above which it answers 413 and the session
        # cannot continue. 32 MiB is Anthropic's cap on the Messages API, so a
        # larger body cannot succeed upstream either. Raising this without
        # raising `api.resources.limits.memory` moves the failure from a 413 to
        # an OOMKill.
        maxRequestBytes: 33554432
        # A token bucket, held per replica rather than per installation. Keep the
        # interval short: `tokensPerFill` and `fillInterval` come from these two
        # fields, so a long interval means a drained bucket stays empty for that
        # whole interval, and a client that refills once an hour is locked out
        # for the rest of it. 100 per minute leaves a leaked key unable to spend
        # much while staying far above what an interactive client asks for.
        rateLimit:
          enabled: true
          requestsPerInterval: 100
          interval: 1m
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      # Room for the buffered request bodies admitted by
      # `api.subscriptionPassthrough.providers.claude.maxRequestBytes`, whose
      # parsed form is several times the bytes on the wire.
      memory: 1Gi
      ephemeral-storage: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  defaultTopologySpread:
    enabled: true

ui:
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
          - type: Pods
            value: 4
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 25
            periodSeconds: 60
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  terminationGracePeriodSeconds: 60
  startupProbe:
    type: httpGet
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 2
    failureThreshold: 30
  readinessProbe:
    type: httpGet
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 5
  livenessProbe:
    type: httpGet
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
  image:
    repository: ghcr.io/demirtechcom/infegate/ui
    tag: "1.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
      ephemeral-storage: 16Mi
    limits:
      memory: 128Mi
      ephemeral-storage: 64Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  defaultTopologySpread:
    enabled: true

ingress:
  enabled: false
  className: ""
  annotations: {}
  tls:
    existingSecret: ""

gateway:
  enabled: false
  create: true
  gatewayClassName: ""
  annotations: {}
  tls:
    existingSecret: ""
  parentRef:
    name: ""
    namespace: ""
    sectionName: ""
