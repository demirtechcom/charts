publicUrl: ""
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

api:
  replicaCount: 2
  metrics:
    enabled: true
    port: 15020
  image:
    repository: ghcr.io/demirtechcom/infegate/gateway
    tag: "1.0.6"
    digest: ""
    pullPolicy: IfNotPresent
  database:
    existingSecret: ""
    key: uri
    maxConnections: 5
  management:
    authenticationMode: oidc
    externalJwt:
      issuer: ""
      audiences: []
      jwksUrl: ""
      headerName: X-Forwarded-Jwt
      authorizationRule: ""
  oidc:
    issuer: ""
    clientId: ""
    scopes:
      - profile
      - email
    existingSecret: ""
    clientSecretKey: client-secret
    cookieSecretKey: cookie-secret
    authorizationRule: ""
  runtime:
    existingSecret: ""
  audit:
    capturePayloads: null
    captureMcpPayloads: false
    sensitiveHeaders:
      - authorization
      - proxy-authorization
      - cookie
      - set-cookie
      - x-infegate-key
      - x-api-key
      - api-key
      - x-goog-api-key
    retention:
      enabled: false
      schedule: "17 3 * * *"
      payloadDays: 30
      metadataDays: 365
      securityContext:
        runAsUser: 70
        runAsGroup: 70
      image:
        repository: postgres
        tag: 18-alpine
        digest: ""
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
  mcp:
    enabled: false
    authenticationMode: nativeOAuth
    issuer: ""
    headerName: X-Forwarded-Jwt
    jwksUrl: ""
    audiences: []
    authorizationRule: ""
  subscriptionPassthrough:
    providers:
      claude:
        enabled: false
        accessKeys: []
        rateLimit:
          enabled: true
          requestsPerInterval: 300
          interval: 1h
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

ui:
  replicaCount: 2
  image:
    repository: ghcr.io/demirtechcom/infegate/ui
    tag: "1.0.6"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  tls:
    existingSecret: ""

gateway:
  enabled: false
  create: true
  gatewayClassName: ""
  annotations: {}
  tls:
    existingSecret: ""
  parentRef:
    name: ""
    namespace: ""
    sectionName: ""
