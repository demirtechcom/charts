publicUrl: ""
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

api:
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
          - type: Pods
            value: 4
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 25
            periodSeconds: 60
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  terminationGracePeriodSeconds: 60
  startupProbe:
    tcpSocket:
      port: readiness
    periodSeconds: 2
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /healthz/ready
      port: readiness
    periodSeconds: 5
  livenessProbe:
    tcpSocket:
      port: readiness
    periodSeconds: 10
  metrics:
    enabled: true
    port: 15020
  image:
    repository: ghcr.io/demirtechcom/infegate/gateway
    tag: "1.0.6"
    digest: ""
    pullPolicy: IfNotPresent
  database:
    existingSecret: ""
    key: uri
    maxConnections: 5
  management:
    authenticationMode: oidc
    externalJwt:
      issuer: ""
      audiences: []
      jwksUrl: ""
      headerName: X-Forwarded-Jwt
      authorizationRule: ""
  oidc:
    issuer: ""
    clientId: ""
    scopes:
      - profile
      - email
    existingSecret: ""
    clientSecretKey: client-secret
    cookieSecretKey: cookie-secret
    authorizationRule: ""
  runtime:
    existingSecret: ""
  audit:
    capturePayloads: null
    captureMcpPayloads: false
    sensitiveHeaders:
      - authorization
      - proxy-authorization
      - cookie
      - set-cookie
      - x-infegate-key
      - x-api-key
      - api-key
      - x-goog-api-key
    retention:
      enabled: false
      schedule: "17 3 * * *"
      payloadDays: 30
      metadataDays: 365
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
      image:
        repository: postgres
        tag: 18-alpine
        digest: ""
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
  mcp:
    enabled: false
    authenticationMode: nativeOAuth
    issuer: ""
    headerName: X-Forwarded-Jwt
    jwksUrl: ""
    audiences: []
    authorizationRule: ""
  subscriptionPassthrough:
    providers:
      claude:
        enabled: false
        accessKeys: []
        rateLimit:
          enabled: true
          requestsPerInterval: 300
          interval: 1h
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      memory: 512Mi
      ephemeral-storage: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  defaultTopologySpread:
    enabled: true

ui:
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
          - type: Pods
            value: 4
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 25
            periodSeconds: 60
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  terminationGracePeriodSeconds: 60
  startupProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 2
    failureThreshold: 30
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 5
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
  image:
    repository: ghcr.io/demirtechcom/infegate/ui
    tag: "1.0.6"
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
      ephemeral-storage: 16Mi
    limits:
      memory: 128Mi
      ephemeral-storage: 64Mi
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  defaultTopologySpread:
    enabled: true

ingress:
  enabled: false
  className: ""
  annotations: {}
  tls:
    existingSecret: ""

gateway:
  enabled: false
  create: true
  gatewayClassName: ""
  annotations: {}
  tls:
    existingSecret: ""
  parentRef:
    name: ""
    namespace: ""
    sectionName: ""
